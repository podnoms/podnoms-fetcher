# An example: the fetcher on the remote host, running its own WireGuard VPN.
# Everything it sends to YouTube goes out through the VPN, and nothing goes out
# at all if the VPN is down.
#
# PodNoms needs to reach port 8080 on this host (e.g. over Tailscale); only
# the VPN's exit IP is seen by the platforms.
services:
  fetcher:
    image: ghcr.io/podnoms/podnoms-fetcher:latest
    # To make the WireGuard interface, its routes and the firewall. The host's
    # kernel needs WireGuard (Linux 5.6 or later).
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      FETCHER_SECRET: ${FETCHER_SECRET}
      # Proton VPN: the PrivateKey from any WireGuard config made at
      # account.protonvpn.com (one key works on every server). See the README
      # for Mullvad, and for any other provider (a folder of its configs).
      VPN_PROVIDER: protonvpn
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      # Near the host is far faster. Each server is another IP to move to.
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Netherlands,Germany,Belgium,France,Switzerland}
    ports:
      - '8080:8080'
    restart: unless-stopped
